<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL UP | Secure Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #020207;
            --bg-card: rgba(8, 8, 18, 0.88);
            --bg-card-hover: rgba(22, 5, 12, 0.96);
            --border-card: rgba(255, 32, 42, 0.28);
            --border-hover: rgba(255, 32, 42, 0.72);
            --accent-cyan: #ff303b;
            --accent-blue: #ff5360;
            --accent-purple: #a000ff;
            --accent-green: #ff6b75;
            --accent-red: #ff202a;
            --accent-amber: #ff9b42;
            --text-main: #f5f5fa;
            --text-muted: #a17a80;
            --glass-glow: 0 8px 32px 0 rgba(255, 0, 30, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #05070d;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dedicated background layer: kept behind the complete dashboard so it
           cannot disappear because of body/pseudo-element stacking rules. */
        .page-video {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #05070d;
        }

        .page-video iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 177.78vh;
            height: 100vh;
            min-width: 100vw;
            min-height: 56.25vw;
            transform: translate(-50%, -50%) scale(1.04);
            border: 0;
            pointer-events: none;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(rgba(5, 7, 13, 0.22), rgba(5, 7, 13, 0.34));
        }

        .page-bg::before {
            content: '';
            position: absolute;
            inset: -6%;
            background: url('/assets/cherry_bg.jpg?v=5') center/cover no-repeat;
            opacity: 0.40;
            filter: saturate(1.14) brightness(1.02) contrast(1.02);
            will-change: transform;
            animation: cherryBreath 34s ease-in-out infinite;
        }

        .page-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(5, 7, 13, 0.08), rgba(5, 7, 13, 0.24));
        }

        .page-petals {
            position: fixed;
            inset: -18% -8%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            color: rgba(255, 183, 219, 0.62);
            font-size: 18px;
            line-height: 90px;
            letter-spacing: 42px;
            white-space: pre-wrap;
            word-spacing: 22px;
            opacity: 0.42;
            will-change: transform;
            animation: petalDrift 38s ease-in-out infinite;
        }

        @keyframes cherryBreath {
            0%, 100% { transform: scale(1.045) translate3d(0, 0, 0); }
            25% { transform: scale(1.075) translate3d(-0.35%, -0.22%, 0); }
            50% { transform: scale(1.095) translate3d(-0.55%, -0.38%, 0); }
            75% { transform: scale(1.07) translate3d(0.25%, 0.30%, 0); }
        }

        @keyframes petalDrift {
            0%, 100% { transform: translate3d(-1%, -4%, 0) rotate(2deg); }
            25% { transform: translate3d(0.5%, 12%, 0) rotate(-1deg); }
            50% { transform: translate3d(2%, 28%, 0) rotate(-3deg); }
            75% { transform: translate3d(-0.5%, 43%, 0) rotate(1deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: var(--glass-glow);
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            padding: 3px;
            background: linear-gradient(135deg, #ff202a, #a000ff, #ff202a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 22px rgba(255, 0, 45, 0.42);
            animation: pulse-glow 3s infinite alternate;
        }
        .logo-box img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
            100% { box-shadow: 0 0 25px rgba(127, 0, 255, 0.5); }
        }

        .brand-text h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--accent-green);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.14), rgba(79, 172, 254, 0.08));
            border: 1px solid rgba(0, 242, 254, 0.34);
            color: #eaffff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 16px rgba(0, 242, 254, 0.10);
            backdrop-filter: blur(10px) saturate(125%);
            -webkit-backdrop-filter: blur(10px) saturate(125%);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 4px 14px rgba(0,0,0,0.12);
            backdrop-filter: blur(10px) saturate(120%);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-hover);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--glass-glow);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .stat-icon.cyan { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); }
        .stat-icon.green { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); }
        .stat-icon.purple { background: rgba(127, 0, 255, 0.15); color: #c084fc; }
        .stat-icon.amber { background: rgba(255, 170, 0, 0.15); color: var(--accent-amber); }

        .stat-content h3 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .stat-content p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Section Layout */
        .dashboard-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-main { grid-template-columns: 1fr; }
        }

        /* Card Box */
        .card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .box-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .account-card {
            background: rgba(10, 15, 30, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .account-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .acc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .acc-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .acc-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e293b, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .acc-info h4 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-badge {
            background: rgba(255, 255, 255, 0.08);
            color: #a5b4fc;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .acc-info span {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .acc-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .status-online {
            background: rgba(0, 255, 136, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.25);
        }

        .status-match {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.4);
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 242, 254, 0.3); }
            100% { border-color: rgba(0, 242, 254, 0.8); }
        }

        /* EXP Box */
        .exp-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            background: rgba(0, 0, 0, 0.28);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .exp-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .exp-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .exp-val {
            font-size: 15px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
        }

        .exp-gained {
            color: var(--accent-green) !important;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .gained-badge {
            background: rgba(0, 255, 136, 0.16);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Level Progress Bar */
        .level-progress {
            margin-bottom: 14px;
        }

        .level-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .acc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.10);
            backdrop-filter: blur(9px) saturate(120%);
            -webkit-backdrop-filter: blur(9px) saturate(120%);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .icon-btn.danger:hover {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Live Logs Stream */
        .logs-box {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .log-stream {
            flex: 1;
            min-height: 480px;
            max-height: 600px;
            background: #03060f;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-stream::-webkit-scrollbar {
            width: 6px;
        }

        .log-stream::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .log-item {
            line-height: 1.4;
            word-break: break-all;
        }

        .log-time { color: #64748b; margin-right: 6px; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 6, 15, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #0c1224;
            border: 1px solid var(--border-card);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 42px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.1);
        }
        /* Match the LEVEL UP login terminal: red neon, glass panels, Matrix rain. */
        body { background:#020207; }
        header,.stat-card,.panel,.modal-content,.table-container,.log-container { border-color:rgba(255,35,48,.24) !important; box-shadow:0 0 24px rgba(255,0,35,.08), inset 0 0 22px rgba(255,0,35,.025); }
        .btn-primary,button.btn-primary { background:linear-gradient(90deg,#ff202a,#ff3040) !important; color:#fff !important; border-color:#ff303b !important; box-shadow:0 0 18px rgba(255,0,30,.24); }
        .btn-primary:hover,button.btn-primary:hover { box-shadow:0 0 28px rgba(255,0,30,.46); transform:translateY(-2px); }
        .btn-secondary,button.btn-secondary { background:rgba(8,5,12,.88) !important; color:#ff727b !important; border-color:rgba(255,48,59,.42) !important; }
        input,select,textarea { border-color:rgba(255,48,59,.35) !important; }
        input:focus,select:focus,textarea:focus { border-color:#ff2936 !important; box-shadow:0 0 0 3px rgba(255,0,30,.10),0 0 20px rgba(255,0,30,.14) !important; }

        /* LEVEL UP terminal theme: same Matrix backdrop and red neon controls as login. */
        :root{--bg-base:#020207;--bg-card:rgba(8,8,18,.88);--bg-card-hover:rgba(18,4,10,.94);--border-card:rgba(255,48,60,.24);--border-hover:rgba(255,48,60,.65);--accent-cyan:#ff303b;--accent-blue:#ff5360;--accent-purple:#a020f0;--accent-green:#7dffac;--accent-red:#ff202a;--glass-glow:0 8px 32px rgba(255,0,30,.09)}
        body{background:#020207!important}
        #matrix{position:fixed;inset:0;width:100%;height:100%;opacity:.48;z-index:0;pointer-events:none}
        .level-vignette,.level-scan{position:fixed;inset:0;pointer-events:none;z-index:0}
        .level-vignette{background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.6) 72%,#000 100%)}
        .level-scan{background:linear-gradient(transparent 49%,rgba(255,0,0,.025) 50%,transparent 51%);background-size:100% 6px;mix-blend-mode:screen}
        .logo-box{overflow:hidden;padding:3px;border:1px solid rgba(255,48,60,.6);background:linear-gradient(135deg,#ff202a,#7200ff,#ff202a);box-shadow:0 0 28px rgba(255,0,60,.38)}
        .logo-box img{width:100%;height:100%;display:block;object-fit:cover;border-radius:11px}
        button,.btn{transition:transform .2s,box-shadow .2s,border-color .2s!important}
        button:hover,.btn:hover{box-shadow:0 0 22px rgba(255,0,40,.32)!important}
        .btn-primary{background:linear-gradient(90deg,#ff202a,#ff3040)!important;border-color:transparent!important;color:#fff!important}
        .btn-secondary{background:rgba(10,5,12,.8)!important;border-color:rgba(255,48,60,.35)!important;color:#ff7b83!important}
    </style>
</head>
<body>
    <canvas id="matrix" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.42;pointer-events:none"></canvas>
    <div aria-hidden="true" style="position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.58) 75%,#000 100%)"></div>
    <div aria-hidden="true" style="position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(transparent 49%,rgba(255,0,0,.025) 50%,transparent 51%);background-size:100% 6px"></div>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo-box">
                    <img src="/assets/level_up_logo.png" alt="LEVEL UP logo">
                </div>
                <div class="brand-text">
                    <h1>ALL SERVER <span style="font-weight:400; color:var(--text-muted); font-size:16px;">| LEVEL UP BOT</span></h1>
                    <p>
                        <span class="live-tag"><span class="pulse-dot"></span> System Live</span>
                        <span>• Safe Multi-Match Engine</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="fetchStats()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon cyan"><i class="fa-solid fa-users"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-accounts">0</h3>
                    <p>Active Accounts</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-angles-up"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-exp" style="color:var(--accent-green)">+0 EXP</h3>
                    <p>Total EXP Gained</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fa-solid fa-gamepad"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-matches">0</h3>
                    <p>Matches Completed</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-content">
                    <h3 id="stat-uptime">00:00:00</h3>
                    <p>Bot Uptime</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-main">
            <!-- Accounts List -->
            <div class="card-box">
                <div class="box-header">
                    <div class="box-title">
                        <i class="fa-solid fa-user-astronaut" style="color:var(--accent-cyan)"></i>
                        <span>Live Accounts & EXP Monitor</span>
                    </div>
                </div>
                <div class="accounts-list" id="accounts-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Loading active accounts...</p>
                    </div>
                </div>
            </div>

            <!-- Real-time Logs -->
            <div class="card-box logs-box">
                <div class="box-header">
                    <div class="box-title">
                        <i class="fa-solid fa-terminal" style="color:var(--accent-green)"></i>
                        <span>Live Match & Bot Logs</span>
                    </div>
                    <span style="font-size:12px; color:var(--text-muted);">Real-time</span>
                </div>
                <div class="log-stream" id="log-stream">
                    <!-- Logs inserted dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus" style="color:var(--accent-cyan); margin-right:8px;"></i> Add New Account</h3>
                <button class="icon-btn" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-acc-form" onsubmit="submitAddAccount(event)">
                <div class="form-group">
                    <label>Account Type</label>
                    <select class="form-input" id="acc-type" onchange="toggleFormType()">
                        <option value="guest">Guest Account (UID + Password)</option>
                        <option value="token">Access Token</option>
                    </select>
                </div>
                <div id="guest-fields">
                    <div class="form-group">
                        <label>Guest UID</label>
                        <input type="text" class="form-input" id="acc-uid" placeholder="e.g. 7644913583">
                    </div>
                    <div class="form-group">
                        <label>Guest Password / Secret</label>
                        <input type="text" class="form-input" id="acc-password" placeholder="e.g. ZERO_GRAVITY_4NM38">
                    </div>
                </div>
                <div id="token-fields" style="display:none;">
                    <div class="form-group">
                        <label>Access Token</label>
                        <textarea class="form-input" id="acc-token" rows="3" placeholder="Paste access token here..."></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Save & Start</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let startTime = Date.now();

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
            document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
        }

        async function submitAddAccount(e) {
            e.preventDefault();
            const type = document.getElementById('acc-type').value;
            let payload = {};
            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) return alert('Please enter both UID and Password');
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) return alert('Please enter token');
                payload = { token };
            }

            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    closeAddModal();
                    document.getElementById('add-acc-form').reset();
                    fetchStats();
                } else {
                    alert('Error adding account: ' + (data.error || 'Unknown'));
                }
            } catch (err) {
                alert('Request failed: ' + err);
            }
        }

        async function deleteAccount(uid) {
            if (!confirm('Are you sure you want to remove account ' + uid + '?')) return;
            try {
                const res = await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function refreshAccountInfo(uid) {
            try {
                await fetch('/api/account/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('stat-total-accounts').innerText = data.total_accounts;
                document.getElementById('stat-total-exp').innerText = '+' + data.total_gained_exp.toLocaleString() + ' EXP';
                document.getElementById('stat-total-matches').innerText = data.total_matches;

                // Render Accounts
                const container = document.getElementById('accounts-container');
                if (data.accounts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-ghost"></i>
                            <p>No active accounts running. Click "+ Add Account" to start!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = data.accounts.map(acc => {
                        const gainedExp = acc.gained_exp || 0;
                        const statusClass = acc.status === 'IN_MATCH' ? 'status-match' : 'status-online';
                        const statusText = acc.status === 'IN_MATCH' ? `In Match (${acc.active_matches} active)` : acc.status;
                        
                        return `
                            <div class="account-card">
                                <div class="acc-top">
                                    <div class="acc-profile">
                                        <div class="acc-avatar"><i class="fa-solid fa-user"></i></div>
                                        <div class="acc-info">
                                            <h4>${escapeHtml(acc.nickname)} <span class="region-badge">${acc.region || 'BD'}</span></h4>
                                            <span>UID: ${acc.uid}</span>
                                        </div>
                                    </div>
                                    <div class="acc-status ${statusClass}">
                                        <span class="pulse-dot"></span>
                                        <span>${statusText}</span>
                                    </div>
                                </div>

                                <div class="exp-box">
                                    <div class="exp-item">
                                        <span class="exp-label">Initial EXP</span>
                                        <span class="exp-val">${acc.initial_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">Current EXP</span>
                                        <span class="exp-val">${acc.current_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">EXP Gained</span>
                                        <span class="exp-val exp-gained">
                                            <span class="gained-badge">+${gainedExp.toLocaleString()} EXP</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="level-progress">
                                    <div class="level-labels">
                                        <span style="color:var(--accent-cyan)">Level ${acc.level}</span>
                                        <span style="color:var(--text-muted)">Matches: ${acc.matches_played}</span>
                                    </div>
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(15, (acc.current_exp % 1000) / 10))}%"></div>
                                    </div>
                                </div>

                                <div class="acc-actions">
                                    <span>Last match: ${acc.last_match_time || 'Running...'}</span>
                                    <div class="action-btns">
                                        <button class="icon-btn" title="Refresh Profile/EXP" onclick="refreshAccountInfo('${acc.uid}')"><i class="fa-solid fa-rotate"></i></button>
                                        <button class="icon-btn danger" title="Delete Account" onclick="deleteAccount('${acc.uid}')"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Render Logs
                const logContainer = document.getElementById('log-stream');
                logContainer.innerHTML = data.logs.map(log => {
                    return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-${log.level}">${escapeHtml(log.message)}</span></div>`;
                }).join('');
                logContainer.scrollTop = logContainer.scrollHeight;

            } catch (err) {
                console.error("Failed to fetch stats:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Uptime counter
        setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
        }, 1000);

        // Live Poll every 2.5s
        fetchStats();
        setInterval(fetchStats, 2500);
    </script>
<script>
(()=>{const c=document.getElementById('matrix');if(!c)return;const x=c.getContext('2d');let drops=[],cols=0;const chars='アカサタナハマヤラワ0123456789LEVELUP';function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.ceil(c.width/15);drops=Array.from({length:cols},()=>Math.random()*-45)}resize();addEventListener('resize',resize);setInterval(()=>{x.fillStyle='rgba(0,0,0,.13)';x.fillRect(0,0,c.width,c.height);x.font='13px JetBrains Mono,monospace';for(let i=0;i<drops.length;i++){x.fillStyle=Math.random()>.9?'#ff3440':'#4b171b';x.fillText(chars[(Math.random()*chars.length)|0],i*15,drops[i]*15);if(drops[i]*15>c.height&&Math.random()>.975)drops[i]=0;drops[i]++}},45)})();
</script>
<script>
(function(){const bar=document.createElement('div');bar.style.cssText='position:fixed;right:14px;top:14px;z-index:99999;display:flex;gap:8px';bar.innerHTML='<button id="lo" style="padding:9px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(10,10,15,.85);color:#fff;cursor:pointer;font:700 10px JetBrains Mono,monospace">LOGOUT</button>';document.body.appendChild(bar);document.getElementById('lo').onclick=async()=>{await fetch('/logout',{method:'POST'});location.href='/'};})();
</script>
</body>
</html>
