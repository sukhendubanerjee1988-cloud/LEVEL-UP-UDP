<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL UP | Admin Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#ff2936;--red2:#ff5360;--panel:rgba(8,8,18,.94)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020207;color:#f5f5fa;font-family:'JetBrains Mono',monospace}
#matrix{position:fixed;inset:0;width:100%;height:100%;opacity:.46;pointer-events:none}.vignette,.scan{position:fixed;inset:0;pointer-events:none}.vignette{background:radial-gradient(circle at center,transparent 12%,rgba(0,0,0,.58) 72%,#000 100%)}.scan{background:linear-gradient(transparent 49%,rgba(255,0,0,.025) 50%,transparent 51%);background-size:100% 6px;mix-blend-mode:screen}
.wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(480px,95vw);padding:28px;border:1px solid rgba(255,32,42,.65);border-radius:23px;background:linear-gradient(145deg,rgba(8,8,18,.97),rgba(18,4,10,.94));box-shadow:0 0 0 1px rgba(255,0,0,.08),0 0 38px rgba(255,0,30,.22),inset 0 0 30px rgba(255,0,30,.035);backdrop-filter:blur(12px);animation:arrive .65s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.avatar{width:92px;height:92px;margin:0 auto 15px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff202a,#7200ff,#ff202a);box-shadow:0 0 28px rgba(255,0,60,.38);animation:pulse 2.8s infinite}.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}@keyframes pulse{50%{box-shadow:0 0 40px rgba(255,0,90,.58)}}
h1{text-align:center;font:800 23px Orbitron,sans-serif;letter-spacing:4px;color:var(--red2);text-shadow:0 0 14px rgba(255,0,25,.55);margin:0}.sub{text-align:center;color:#9c5960;font-size:9px;letter-spacing:2.4px;margin:9px 0 23px}.terminal{color:var(--red);font-size:11px;letter-spacing:1.5px;margin:18px 0 8px}.cursor{display:inline-block;width:7px;height:12px;background:var(--red);margin-left:4px;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:0}}
input{width:100%;height:50px;background:rgba(0,0,0,.42);border:1px solid rgba(255,48,60,.48);border-radius:10px;color:#fff;padding:0 14px;outline:none;margin:7px 0 10px;font:600 12px 'JetBrains Mono';letter-spacing:1px;transition:.2s}input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,0,30,.1),0 0 20px rgba(255,0,30,.15)}
button{width:100%;min-height:49px;margin:5px 0 10px;border:1px solid transparent;border-radius:10px;background:linear-gradient(90deg,#ff202a,#ff3040);color:#fff;font:800 11px Orbitron,sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 0 18px rgba(255,0,30,.24);transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(255,0,30,.48)}button:active{transform:translateY(0)}
.panel{display:none}.panel.show{display:block}.section-title{margin:22px 0 8px;padding-top:16px;border-top:1px solid rgba(255,48,60,.2);font:700 12px Orbitron,sans-serif;letter-spacing:1.5px;color:#ff5964}.msg{min-height:20px;text-align:center;font-size:10px;line-height:1.6;margin-top:8px;color:#a87b80}.ok{color:#7dffac}.err{color:#ff5c67}.back{display:block;text-align:center;color:#9c5960;text-decoration:none;font-size:10px;letter-spacing:1px;margin-top:16px}.back:hover{color:#ff5360}.hint{text-align:center;font-size:9px;line-height:1.7;color:#654247;margin-top:13px}
</style></head>
<body><canvas id="matrix"></canvas><div class="vignette"></div><div class="scan"></div>
<div class="wrap"><main class="box"><div class="avatar"><img src="/assets/level_up_logo.png" alt="LEVEL UP logo"></div><h1>LEVEL UP</h1><div class="sub">ADMIN CONTROL TERMINAL</div>
<section id="authSection"><div class="terminal">&gt; ADMIN_AUTHENTICATION<span class="cursor"></span></div><input id="adminCode" type="password" autocomplete="current-password" placeholder="ENTER CURRENT ADMIN CODE"><button id="authButton" type="button">&gt;_ AUTHORIZE ADMIN</button></section>
<section id="controlPanel" class="panel"><div class="terminal">&gt; CONTROL_PANEL / ACCESS SETTINGS</div>
<div class="section-title">CHANGE USER LOGIN CODE</div><input id="newAccessCode" type="password" autocomplete="new-password" placeholder="NEW USER ACCESS CODE (6+ CHARS)"><input id="confirmAccessCode" type="password" autocomplete="new-password" placeholder="CONFIRM USER ACCESS CODE"><button id="accessButton" type="button">UPDATE LOGIN CODE</button>
<div class="section-title">CHANGE ADMIN CODE</div><input id="newAdminCode" type="password" autocomplete="new-password" placeholder="NEW ADMIN CODE (8+ CHARS)"><input id="confirmAdminCode" type="password" autocomplete="new-password" placeholder="CONFIRM NEW ADMIN CODE"><button id="adminButton" type="button">UPDATE ADMIN CODE</button>
</section><div id="msg" class="msg" role="status"></div><a class="back" href="/">← BACK TO LEVEL UP</a><div class="hint">Admin settings are protected by an authenticated admin session.<br>Keep your admin code private.</div></main></div>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
function message(text,kind=''){msg.textContent=text;msg.className='msg '+kind}
async function post(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
$('authButton').addEventListener('click',async()=>{message('AUTHORIZING ADMIN...');try{await post('/admin/auth',{admin_code:$('adminCode').value});$('authSection').style.display='none';$('controlPanel').classList.add('show');message('✓ ADMIN ACCESS GRANTED','ok')}catch(e){message('✕ '+e.message,'err')}});
$('adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('authButton').click()});
$('accessButton').addEventListener('click',async()=>{const a=$('newAccessCode').value,b=$('confirmAccessCode').value;if(a!==b)return message('Access codes do not match','err');try{await post('/admin/change-code',{new_access_code:a});$('newAccessCode').value=$('confirmAccessCode').value='';message('✓ USER LOGIN CODE UPDATED','ok')}catch(e){message('✕ '+e.message,'err')}});
$('adminButton').addEventListener('click',async()=>{const a=$('newAdminCode').value,b=$('confirmAdminCode').value;if(a!==b)return message('Admin codes do not match','err');try{await post('/admin/change-admin-code',{new_admin_code:a,confirm_admin_code:b});$('newAdminCode').value=$('confirmAdminCode').value='';message('✓ ADMIN CODE UPDATED. USE THE NEW CODE NEXT TIME.','ok')}catch(e){message('✕ '+e.message,'err')}});
(()=>{const c=$('matrix'),x=c.getContext('2d'),chars='アカサタナハマヤラワ0123456789LEVELUP';let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array.from({length:Math.ceil(c.width/15)},()=>Math.random()*-40)}resize();addEventListener('resize',resize);setInterval(()=>{x.fillStyle='rgba(0,0,0,.13)';x.fillRect(0,0,c.width,c.height);x.font='13px JetBrains Mono,monospace';for(let i=0;i<drops.length;i++){x.fillStyle=Math.random()>.9?'#ff3440':'#4b171b';x.fillText(chars[(Math.random()*chars.length)|0],i*15,drops[i]*15);if(drops[i]*15>c.height&&Math.random()>.975)drops[i]=0;drops[i]++}},45)})();
</script></body></html>
